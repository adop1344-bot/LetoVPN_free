name: VPN config checker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: |
          curl -Lo x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -j x.zip xray -d . && chmod +x xray && sudo mv xray /usr/local/bin/ && rm x.zip
          xray version
      - run: |
          curl -sLo G.mmdb.gz https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz
          gzip -d G.mmdb.gz
      - name: Check configs
        run: python -m src.app
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: configs
          path: |
            configs.txt
            configs*.txt
            ru.txt
            configs_hiddify.txt
            ru_hiddify.txt
            protocols/
      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add configs.txt configs*.txt ru.txt configs_hiddify.txt ru_hiddify.txt protocols/
          if [ -n "$(git diff --cached)" ]; then
            git commit -m "auto-update $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi