name: Hourly VPN config test

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xray
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -j xray.zip xray -d .
          chmod +x xray
          sudo mv xray /usr/local/bin/
          rm xray.zip
          xray version

      - name: Download GeoIP database
        run: |
          curl -L -o GeoLite2-Country.mmdb.gz https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz
          gzip -d GeoLite2-Country.mmdb.gz

      - name: Run config tester
        run: python -m src.app
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: configs
          path: |
            configs.txt
            ru.txt
            configs_hiddify.txt
            ru_hiddify.txt
            checked*.txt
            protocols/

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config.user.email "action@github.com"
          git add configs.txt ru.txt configs_hiddify.txt ru_hiddify.txt checked*.txt protocols/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update configs $(date '+%Y-%m-%d %H:%M')"
          git push
